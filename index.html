<style>
:root{--bg:#f5f3ff;--card:#fff;--tx:#1e1b3a;--mut:#6b6890;--ac:#6d4aff;--ac2:#ff6b9d;--bd:#e4e0f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13112a;--card:#1d1a3a;--tx:#f1efff;--mut:#a29fc8;--bd:#2f2b57}}
:root[data-theme="dark"]{--bg:#13112a;--card:#1d1a3a;--tx:#f1efff;--mut:#a29fc8;--bd:#2f2b57}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,#6d4aff,#b04bff 60%,#ff6b9d);color:#fff;padding:14px 16px 16px;border-radius:0 0 22px 22px}
.logo{font-size:26px;font-weight:800;letter-spacing:-.5px}
.tag{margin-top:6px;font-size:13px;background:rgba(255,255,255,.2);border-radius:20px;padding:5px 12px;display:inline-block}
main{padding:10px 16px 96px;max-width:560px;margin:auto}
h2{margin:8px 0 4px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 2px 8px rgba(109,74,255,.06)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.em{font-size:34px}
.price{color:var(--ac);font-weight:700}
.mut{color:var(--mut);font-size:13px}
button{font:inherit;border:0;border-radius:12px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.sm{padding:4px 11px}
a.btn{display:inline-block;text-decoration:none;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:9px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
.chips button{white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{border-radius:20px;padding:16px 14px;color:#fff;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;cursor:pointer}
.tile b{font-size:17px}.tile span{font-size:12px;opacity:.9}.tile i{font-style:normal;font-size:36px}
input,select{width:100%;font:inherit;padding:10px;margin:5px 0;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:10px 2px;font-size:13px}
nav button.on{color:var(--ac);font-weight:700}
.badge{display:inline-block;background:var(--ac2);color:#fff;border-radius:9px;padding:0 6px;font-size:12px}
.st{font-size:13px;font-weight:600}
.wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pct{background:linear-gradient(135deg,#ff6b9d,#ff9a3c);color:#fff;border-radius:14px;padding:10px 12px;font-weight:800;font-size:20px}
</style>

function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function $(i){return document.getElementById(i)}
function money(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' so’m'}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cnt(){var n=0;for(var k in cart)n+=cart[k];return n}
function put(k,x){D[k].unshift(x);save('sg3_'+k,D[k]);if(k==='o'||k==='q')notify(k,x)}
function notify(k,x){try{fetch('/api/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:k,data:x})}).catch(function(){})}catch(e){}}
function del(k,id){D[k]=D[k].filter(function(x){return x.id!==id});save('sg3_'+k,D[k]);if(db)db.collection(COL[k]).doc(id).delete().catch(function(){});render()}

function reg(){var n=$('rn').value.trim(),p=$('rp').value.trim();if(!n||p.length<7){alert('Ism va telefon raqamni to’g’ri kiriting');return}me={name:n,phone:p};save('sg3_me',me);notify('r',me);render()}
function go(v,s){view=v;if(s)sec=s;render();window.scrollTo(0,0)}
function add(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];save('sg3_cart',cart);render()}
function order(){
  var it=[],tot=0;
  D.p.forEach(function(x){if(cart[x.id]){it.push({n:x.n,q:cart[x.id],p:x.p});tot+=x.p*cart[x.id]}});
  if(!it.length)return;
  if(co.dt==='delivery'&&!co.place.trim()){alert('Yetkazish joyini yozing');return}
  put('o',{id:'o'+Date.now(),t:Date.now(),name:me.name,phone:me.phone,items:it,total:tot,dt:co.dt,place:co.dt==='delivery'?co.place.trim():'—',note:co.note.trim(),s:'new'});
  cart={};save('sg3_cart',cart);co={dt:'pickup',place:'',note:''};alert('Buyurtma qabul qilindi! ✅');go('orders')
}

  return h;
}

  var h=back()+'<h2>🏠 Uy qidirish</h2><div class="chips">'+F.map(function(f){return '<button class="'+(hf===f[1]?'':'g')+'" onclick="hf='+f[1]+';render()">'+f[0]+'</button>'}).join('')+'</div>';
  var AR=[];D.h.forEach(function(x){var g=x.a.split(',')[0];if(AR.indexOf(g)<0)AR.push(g)});h+='<div class="chips">'+['Barcha hudud'].concat(AR).map(function(g,i){var v=i?g:'';return '<button class="sm '+(ha===v?'':'g')+'" onclick="ha=\''+v+'\';render()">'+g+'</button>'}).join('')+'</div>';var l=D.h.filter(function(x){return (!hf||x.p<=hf)&&(!ha||x.a.split(',')[0]===ha)});
  return h+(l.length?l.map(function(x){return '<div class="card"><div class="row"><div class="em">'+esc(x.e)+'</div><div class="grow"><b>'+esc(x.n)+'</b><div class="mut">📍 '+esc(x.a)+' · '+esc(x.r)+'</div><div class="mut">'+esc(x.m)+'</div></div></div><div class="row" style="margin-top:8px"><div class="price grow">'+(x.p?money(x.p)+' / oy':'Narxni so’rang')+'</div>'+(x.ph?'<a class="btn" href="tel:'+esc(x.ph)+'">📞 Qo’ng’iroq</a>':'')+'<button onclick="apply(\''+x.id+'\')">Ariza</button></div></div>'}).join(''):'<div class="card">Bunday e’lon topilmadi.</div>');
}
function vDeals(){
  return back()+'<h2>🏷️ Chegirmalar</h2><div class="mut">Talaba ekanligingizni ko’rsating va kodni ayting</div>'+D.d.map(function(x){return '<div class="card row"><div class="pct">-'+x.pc+'%</div><div class="grow"><b>'+esc(x.e)+' '+esc(x.n)+'</b><div class="mut">'+esc(x.t)+'</div></div><button onclick="alert(\'Kod: '+esc(x.code)+'\')">Kod</button></div>'}).join('');
}
function vCart(){
  var h=back()+'<h2>🛒 Savat</h2>',tot=0;
  D.p.forEach(function(x){var q=cart[x.id];if(!q)return;tot+=x.p*q;
    h+='<div class="card row"><div class="grow"><b>'+esc(x.n)+'</b><div class="mut">'+money(x.p)+' × '+q+'</div></div><button class="g sm" onclick="add(\''+x.id+'\',-1)">−</button><b>'+q+'</b><button class="sm" onclick="add(\''+x.id+'\',1)">+</button></div>'});
  if(!tot)return h+'<div class="card">Savat bo’sh.</div>';
  return h+'<div class="card"><div class="row"><b class="grow">Jami</b><div class="price">'+money(tot)+'</div></div>'+
  '<div class="wrap"><button class="'+(co.dt==='pickup'?'':'g')+'" onclick="co.dt=\'pickup\';render()">🏃 Olib ketaman</button><button class="'+(co.dt==='delivery'?'':'g')+'" onclick="co.dt=\'delivery\';render()">🚚 Yetkazish</button></div>'+
  (co.dt==='delivery'?'<input placeholder="Kampusda qayerga? (bino, xona)" value="'+esc(co.place)+'" oninput="co.place=this.value">':'')+
  '<input placeholder="Izoh (ixtiyoriy)" value="'+esc(co.note)+'" oninput="co.note=this.value">'+
  '<button style="width:100%;margin-top:6px" onclick="order()">✅ Buyurtma berish</button></div>';
}
function oCard(o,adm){
  var h='<div class="card"><div class="row"><b class="grow">#'+esc(o.id.slice(-5))+(adm?' · '+esc(o.name)+' · '+esc(o.phone):'')+'</b><span class="st">'+ST[o.s]+'</span></div><div class="mut">'+o.items.map(function(i){return esc(i.n)+' ×'+i.q}).join(', ')+'</div><div>'+(o.dt==='delivery'?'🚚 '+esc(o.place):'🏃 Olib ketish')+(o.note?' · 💬 '+esc(o.note):'')+'</div><div class="price">'+money(o.total)+'</div>';
  if(adm){h+='<div class="wrap">';['accepted','cooking','ready','done','cancelled'].forEach(function(s){h+='<button class="'+(o.s===s?'':'g')+' sm" onclick="setS(\''+o.id+'\',\''+s+'\')">'+ST[s]+'</button>'});h+='</div>'}
  return h+'</div>';
}
function vOrders(){var l=D.o.filter(function(o){return o.phone===me.phone});return back()+'<h2>📦 Buyurtmalarim</h2>'+(l.length?l.map(function(o){return oCard(o,false)}).join(''):'<div class="card">Hali buyurtma yo’q.</div>')}
function vAdmin(){
  if(!admin)return '<h2>⚙️ Admin</h2><div class="card"><input id="pn" type="password" placeholder="PIN kod" inputmode="numeric"><button onclick="pin()">Kirish</button><div class="mut">Namuna PIN: 1234</div></div>';
  var h='<h2>Buyurtmalar ('+D.o.length+')</h2>'+(D.o.length?D.o.map(function(o){return oCard(o,true)}).join(''):'<div class="card">Yo’q.</div>');
  h+='<h2>Uy arizalari ('+D.q.length+')</h2>'+D.q.map(function(q){return '<div class="card"><b>'+esc(q.name)+'</b> · '+esc(q.phone)+'<div class="mut">'+esc(q.what)+'</div></div>'}).join('');
  var opts=FC.map(function(c,i){return '<option value="food:'+i+'">Ovqat: '+c+'</option>'}).concat(SC.map(function(c,i){return '<option value="shop:'+i+'">Kiyim: '+c+'</option>'})).join('');
  h+='<h2>Mahsulot qo’shish</h2><div class="card"><select id="xc">'+opts+'</select><input id="xn" placeholder="Nomi"><input id="xp" type="number" placeholder="Narxi"><input id="xk" placeholder="Kafe / do’kon"><input id="xe" placeholder="Emoji"><button onclick="addP()">Qo’shish</button></div>'+
  '<h2>Uy e’loni qo’shish</h2><div class="card"><input id="hn" placeholder="Sarlavha"><input id="hp" type="number" placeholder="Oylik narx"><input id="ha" placeholder="Hudud"><input id="hr" placeholder="Xonalar"><input id="hm" placeholder="Qulayliklar"><input id="hph" type="tel" placeholder="Telefon"><button onclick="addH()">Qo’shish</button></div>'+
  '<h2>Chegirma qo’shish</h2><div class="card"><input id="dn" placeholder="Hamkor nomi"><input id="dp" type="number" placeholder="Foiz"><input id="dt" placeholder="Nimaga chegirma"><input id="dc" placeholder="Kod"><input id="de" placeholder="Emoji"><button onclick="addD()">Qo’shish</button></div>'+
  '<h2>Ro’yxatni boshqarish</h2>';
  [['p','n'],['h','n'],['d','n']].forEach(function(t){D[t[0]].forEach(function(x){h+='<div class="card row"><div class="grow">'+esc(x.e)+' '+esc(x.n)+'</div><button class="g sm" onclick="del(\''+t[0]+'\',\''+x.id+'\')">🗑</button></div>'})});
  return h;
}
function render(soft){
  var a=document.activeElement;if(soft&&a&&/INPUT|SELECT/.test(a.tagName))return;
  if(!me){$('app').innerHTML='<div class="card"><h2>Xush kelibsiz! 👋</h2><div class="mut">Davom etish uchun ism va telefon raqamingizni kiriting.</div><input id="rn" placeholder="Ismingiz"><input id="rp" type="tel" placeholder="Telefon raqamingiz"><button style="width:100%;margin-top:6px" onclick="reg()">Boshlash</button></div>';$('nav').innerHTML='';return}
  $('app').innerHTML={home:vHome,cat:vCat,homes:vHomes,deals:vDeals,cart:vCart,orders:vOrders,admin:vAdmin}[view]();
  var n=cnt();
  $('nav').innerHTML=[['home','🏠 Xizmatlar'],['cart','🛒 Savat'+(n?' <span class="badge">'+n+'</span>':'')],['orders','📦 Buyurtmalar']].concat(location.hash==='#admin'?[['admin','⚙️ Admin']]:[]).map(function(t){return '<button class="'+(view===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
}
try{if(!localStorage.getItem('sg3_seen')){localStorage.setItem('sg3_seen','1');notify('v',{})}}catch(e){}
render();
</script>
</body>
</html>
